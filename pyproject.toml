[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwlog-analyzer"
version = "0.1.0"
description = "Parse and analyze simulated hardware validation logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
dashboard = ["streamlit>=1.35"]

[project.scripts]
hwlog-analyzer = "hwlog_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
